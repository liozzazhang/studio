<!doctype html>
<html lang="zh-CN" class="no-js" data-title-zh="{{TITLE_ZH}} — Studio" data-title-en="{{TITLE_EN}} — Studio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="{{DESCRIPTION_ZH}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE_EN}} — Studio">
  <meta property="og:description" content="{{DESCRIPTION_EN}}">
  <meta property="og:url" content="https://liozzazhang.github.io/studio/{{PAGE_SLUG}}/">
  <link rel="canonical" href="https://liozzazhang.github.io/studio/{{PAGE_SLUG}}/">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/studio.css">
  <script src="../assets/studio.js" defer></script>
  <script src="../assets/catalog.js" defer></script>
  <title>{{TITLE_ZH}} — Studio</title>
</head>
<body>
  <a class="skip-link" href="#main" data-zh="跳到主要内容" data-en="Skip to content">跳到主要内容</a>
  <header class="site-header shell"><a class="brand" href="../" aria-label="Studio home"><span class="brand-mark">lz.</span><span>STUDIO<span class="brand-slash"> / </span><small>Liozza</small></span></a><nav class="header-actions" aria-label="Navigation"><button class="language-toggle" data-language-toggle type="button" aria-label="Switch to English"><span data-language-label>EN</span></button><a class="github-link" href="https://github.com/liozzazhang" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></nav></header>
  <main class="shell" id="main">
    <nav class="section-switcher" aria-label="项目目录" data-label-zh="项目目录" data-label-en="Project directories">{{SECTION_NAV}}</nav>
    <section class="catalog-hero" aria-labelledby="catalog-title"><p class="eyebrow"><span class="square-dot"></span>{{EYEBROW}}</p><h1 id="catalog-title" data-zh="{{TITLE_ZH}}" data-en="{{TITLE_EN}}">{{TITLE_ZH}}</h1><p data-zh="{{DESCRIPTION_ZH}}" data-en="{{DESCRIPTION_EN}}">{{DESCRIPTION_ZH}}</p><div class="catalog-meta"><span>{{COUNT}} <span data-zh="个公开仓库" data-en="PUBLIC REPOSITORIES">个公开仓库</span></span><span data-zh="核对于 {{CHECKED_AT}}" data-en="REVIEWED {{CHECKED_AT}}">核对于 {{CHECKED_AT}}</span></div></section>
    <section class="catalog-content" aria-labelledby="catalog-heading"><h2 id="catalog-heading" class="sr-only" data-zh="项目列表" data-en="Project list">项目列表</h2>
      <div class="catalog-toolbar"><div class="catalog-filters" role="group" aria-labelledby="filter-label"><span id="filter-label" class="sr-only" data-zh="按领域筛选" data-en="Filter by area">按领域筛选</span>{{FILTERS}}</div><label class="catalog-search"><span class="sr-only" data-zh="搜索项目、功能或技术" data-en="Search projects, features, or technologies">搜索项目、功能或技术</span><span aria-hidden="true">⌕</span><input id="catalog-search" type="search" autocomplete="off" placeholder="搜索项目、功能或技术" data-placeholder-zh="搜索项目、功能或技术" data-placeholder-en="Search projects, features, or technologies"><button id="clear-search" type="button" hidden data-zh="清空" data-en="Clear">清空</button></label></div>
      <p class="catalog-result-count" id="catalog-result-count" role="status" aria-live="polite" data-total="{{COUNT}}"><span data-zh="显示 {{COUNT}} 个项目" data-en="Showing {{COUNT}} projects">显示 {{COUNT}} 个项目</span></p>
      <div class="catalog-grid">{{CARDS}}</div><div class="catalog-empty" id="catalog-empty" hidden><span aria-hidden="true">{ }</span><h3 data-zh="没有找到匹配项目" data-en="No matching projects">没有找到匹配项目</h3><p data-zh="换一个关键词，或选择其他分类。" data-en="Try another keyword or choose a different category.">换一个关键词，或选择其他分类。</p></div>
    </section>
    <aside class="catalog-footnote"><span aria-hidden="true">↳</span><p data-zh="{{FOOTNOTE_ZH}}" data-en="{{FOOTNOTE_EN}}">{{FOOTNOTE_ZH}}</p></aside>
  </main>
  <footer class="site-footer shell"><span>© <span data-year>2026</span> Lei Zhang / Liozza</span><a href="../" data-zh="返回 Studio ↖" data-en="Back to Studio ↖">返回 Studio ↖</a></footer>
</body>
</html>
