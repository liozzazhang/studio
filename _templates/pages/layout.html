<!doctype html>
<html lang="{{HTML_LANG}}" class="no-js" data-default-language="{{LANG}}" data-title-zh="{{TITLE_ZH}}" data-title-en="{{TITLE_EN}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE_EN}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="{{FAVICON}}" type="image/svg+xml">
  <link rel="stylesheet" href="{{STYLESHEET}}">
  <script src="{{SCRIPT}}" defer></script>
  {{SCRIPTS}}
  <title>{{TITLE}}</title>
</head>
<body>
  {{SKIP_LINK}}
  {{HEADER}}
  <main id="main">{{BODY}}</main>
  {{FOOTER}}
  {{DIALOG}}
  <noscript><p class="noscript">{{NOSCRIPT}}</p></noscript>
</body>
</html>
