<!doctype html>
<html lang="zh-CN" class="no-js" data-title-zh="{{TITLE_ZH}}" data-title-en="{{TITLE_EN}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE_EN}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="/studio/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/studio/assets/studio.css">
  <script src="/studio/assets/studio.js" defer></script>
  {{SCRIPTS}}
  <title>{{TITLE_ZH}}</title>
</head>
<body>
  <a class="skip-link" href="#main" data-zh="跳到主要内容" data-en="Skip to content">跳到主要内容</a>
  {{HEADER}}
  <main id="main">{{BODY}}</main>
  {{FOOTER}}
  {{DIALOG}}
  <noscript><p class="noscript">当前为中文版；项目与履历可直接阅读，私有仓库链接会打开权限申请说明。启用 JavaScript 可切换语言与筛选项目。 / English and project filtering require JavaScript.</p></noscript>
</body>
</html>
